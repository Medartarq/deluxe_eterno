spring:
  application:
    name: deluxe-eterno
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/deluxe_eterno?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: ${PORT:8080}

app:
  demo:
    available: ${DEMO_AVAILABLE:true}
  media:
    directory: ${MEDIA_DIRECTORY:./uploads}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
