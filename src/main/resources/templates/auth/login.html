<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="login-body">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div th:replace="~{fragments/demo :: banner}"></div>
            <div class="text-center mb-4"><a th:href="@{/}"><img class="login-logo mb-4" th:src="@{/assets/brand/logo-principal.png}" alt="Deluxe Eterno" width="240" height="110"></a><h1 class="fw-bold h2">Acceso de administración</h1><p class="text-secondary">Acceso reservado para el equipo de Deluxe Eterno.</p></div>
            <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
            <div class="alert alert-success" th:if="${param.logout}">Sesión cerrada correctamente.</div>
            <form class="card border-0 shadow-sm p-4 p-md-5" th:action="@{/login}" method="post">
                <div class="mb-3"><label for="username" class="form-label">Usuario</label><input class="form-control" id="username" name="username" type="text" autocomplete="username" required></div>
                <div class="mb-4"><label for="password" class="form-label">Contraseña</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
                <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
