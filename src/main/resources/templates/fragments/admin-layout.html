<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="adminHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' | Panel Deluxe Eterno'}">Panel</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/brand/favicon.svg}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/brand/favicon-32.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/brand/apple-touch-icon.png}">
    <meta name="theme-color" content="#ef6669">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body class="admin-body">
<nav th:fragment="adminNavbar" class="navbar navbar-expand-lg navbar-dark admin-navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">Deluxe Eterno <span class="badge text-bg-light ms-2">Panel</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarContent" aria-controls="adminNavbarContent" aria-expanded="false" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button>
        <div id="adminNavbarContent" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/products}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/categories}">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/inquiries}">Consultas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Ver sitio</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div th:fragment="adminFlash" class="container mt-4">
    <div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}">Operación realizada.</div>
    <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">No se pudo completar la operación.</div>
</div>
<footer th:fragment="adminFooter" class="admin-footer py-3 mt-5"><div class="container small">Deluxe Eterno • Administración del catálogo</div></footer>
<th:block th:fragment="adminScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</th:block>
</body>
</html>
