<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Deluxe Eterno, tienda virtual de Trujillo especializada en detalles personalizados, regalos y floristería.">
    <title th:text="${title + ' | Deluxe Eterno'}">Deluxe Eterno</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/brand/favicon.svg}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/brand/favicon-32.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/brand/apple-touch-icon.png}">
    <meta name="theme-color" content="#ef6669">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link th:if="${demoEnabled}" th:href="@{/css/demo.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" id="mainNav" class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <img class="brand-logo" th:src="@{/assets/brand/logo-principal.png}" alt="Deluxe Eterno" width="184" height="72">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navbarContent" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/nosotros}">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/servicios}">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/galeria}">Galería</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contacto}">Contacto</a></li>
                <li class="nav-item ms-lg-3"><a class="btn btn-primary btn-sm px-3" th:href="@{/contacto}">Hacer consulta <i class="bi bi-arrow-up-right ms-1"></i></a></li>
            </ul>
        </div>
    </div>
</nav>
<footer th:fragment="footer" class="py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-3 align-items-center">
        <div><strong class="footer-wordmark">Deluxe Eterno<span>.</span></strong><span class="d-block small text-white-50 mt-2">Tienda virtual · Trujillo, Perú</span></div>
        <div class="small text-white-50">Detalles personalizados · Regalos · Floristería</div>
        <div class="small text-white-50 d-flex flex-wrap gap-3">
            <a class="text-white-50" href="https://www.instagram.com/deluxeeterno" target="_blank" rel="noopener">Instagram</a>
            <a class="text-white-50" href="https://www.facebook.com/profile.php?id=61550209177936" target="_blank" rel="noopener">Facebook</a>
            <a class="text-white-50" href="https://www.tiktok.com/@deluxeeterno" target="_blank" rel="noopener">TikTok</a>
            <a class="text-white-50" href="https://www.pinterest.com/deluxeeterno/_created/" target="_blank" rel="noopener">Pinterest</a>
        </div>
    </div>
</footer>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:if="${demoEnabled}" th:src="@{/js/demo.js}"></script>
</th:block>
</body>
</html>
