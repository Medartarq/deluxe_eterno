<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="py-5 bg-soft">
    <div class="container">
        <div class="d-flex flex-column gap-3 mb-4">
            <div><span class="section-kicker">Productos</span><h1 class="fw-bold mb-0">Catálogo</h1></div>
            <div class="d-flex flex-wrap gap-2" role="group" aria-label="Filtro de categorías">
                <a class="btn btn-outline-primary" th:classappend="${selectedCategory == null} ? ' active'" th:href="@{/productos}">Todos</a>
                <a class="btn btn-outline-primary" th:classappend="${selectedCategory != null && selectedCategory == category.id} ? ' active'" th:each="category : ${categories}" th:href="@{/productos(categoria=${category.id})}" th:text="${category.name}">Categoría</a>
            </div>
        </div>
        <div class="row g-4" th:if="${!products.isEmpty()}">
            <div class="col-12 col-md-6 col-lg-4" th:each="product : ${products}">
                <article class="card product-card h-100 border-0 shadow-sm">
                    <div class="product-photo"><img th:src="@{${product.imagePath}}" class="card-img-top" loading="lazy" width="750" height="1000" th:alt="${product.name}" alt="Producto"></div>
                    <div class="card-body">
                        <span class="badge text-bg-light mb-2" th:text="${product.category.name}">Categoría</span>
                        <h2 class="h5" th:text="${product.name}">Producto</h2>
                        <p class="text-secondary" th:text="${product.description}">Descripción</p>
                        <div class="d-grid gap-2">
                            <a class="btn btn-primary" th:href="@{/productos/{id}(id=${product.id})}">Consultar opciones</a>
                            <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal"
                                    th:data-bs-target="'#productModal-' + ${product.id}">
                                <i class="bi bi-eye me-2"></i>Vista rápida
                            </button>
                        </div>
                    </div>
                </article>
            </div>
            <div th:replace="~{public/product-modal :: productModals}"></div>
        </div>
        <div class="empty-state" th:if="${products.isEmpty()}"><i class="bi bi-flower1" aria-hidden="true"></i><div><h2 class="h4">Busquemos un detalle para ti</h2><p>No hay opciones publicadas para esta categoría. Puedes enviarnos una consulta para conocer más alternativas.</p></div><a class="btn btn-primary" th:href="@{/contacto}">Consultar opciones <i class="bi bi-arrow-up-right ms-2"></i></a></div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
