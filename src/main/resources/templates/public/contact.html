<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contacto')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/demo :: banner}"></div>
<main class="py-5">
    <div class="container">
        <div class="row g-5">
            <div class="col-lg-5">
                <span class="section-kicker">Contacto</span>
                <h1 class="fw-bold">Hablemos de tu próximo detalle</h1>
                <p class="text-secondary">Elige uno de nuestros canales oficiales o registra tu consulta para que podamos conocer lo que buscas.</p>
                <div class="list-group list-group-flush contact-list contact-channels">
                    <div class="list-group-item px-0"><i class="bi bi-geo-alt me-2"></i>Trujillo, La Libertad, Perú</div>
                    <a class="list-group-item list-group-item-action px-0 text-decoration-none" href="https://www.instagram.com/deluxeeterno" target="_blank" rel="noopener"><i class="bi bi-instagram me-2"></i>Instagram</a>
                    <a class="list-group-item list-group-item-action px-0 text-decoration-none" href="https://www.facebook.com/profile.php?id=61550209177936" target="_blank" rel="noopener"><i class="bi bi-facebook me-2"></i>Facebook</a>
                    <a class="list-group-item list-group-item-action px-0 text-decoration-none" href="https://www.tiktok.com/@deluxeeterno" target="_blank" rel="noopener"><i class="bi bi-tiktok me-2"></i>TikTok</a>
                    <a class="list-group-item list-group-item-action px-0 text-decoration-none" href="https://www.pinterest.com/deluxeeterno/_created/" target="_blank" rel="noopener"><i class="bi bi-pinterest me-2"></i>Pinterest</a>
                    <a class="list-group-item list-group-item-action px-0 text-decoration-none" href="https://linktr.ee/tiendavirtual.deluxeeterno" target="_blank" rel="noopener"><i class="bi bi-link-45deg me-2"></i>Todos los enlaces</a>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}">Consulta registrada.</div>
                <form class="card border-0 shadow-sm p-4 p-md-5" th:action="@{/contactos}" th:object="${inquiryForm}" method="post">
<div th:replace="~{fragments/demo :: tools('contact')}"></div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Nombre <span class="text-secondary">(obligatorio)</span></label>
                            <input type="text" id="name" class="form-control" th:field="*{name}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('name')}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Teléfono <span class="text-secondary">(opcional)</span></label>
                            <input type="tel" id="phone" class="form-control" th:field="*{phone}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('phone')}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Error</div>
                        </div>
                        <div class="col-12">
                            <label for="email" class="form-label">Correo <span class="text-secondary">(obligatorio)</span></label>
                            <input type="email" id="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('email')}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                        </div>
                        <div class="col-12">
                            <label for="message" class="form-label">Mensaje <span class="text-secondary">(obligatorio)</span></label>
                            <textarea id="message" class="form-control" rows="5" th:field="*{message}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('message')}"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('message')}" th:errors="*{message}">Error</div>
                        </div>
                        <div class="col-12"><button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-send me-2"></i>Enviar consulta</button></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
