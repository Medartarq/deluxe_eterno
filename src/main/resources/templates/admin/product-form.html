<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead(${editing} ? 'Editar producto' : 'Nuevo producto')}"></head>
<body class="admin-body">
<nav th:replace="~{fragments/admin-layout :: adminNavbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/admin-layout :: adminFlash}"></div>
    <div class="mb-4"><a class="btn btn-link px-0" th:href="@{/admin/products}"><i class="bi bi-arrow-left me-1"></i>Volver a productos</a><h1 class="fw-bold" th:text="${editing} ? 'Editar producto' : 'Nuevo producto'">Nuevo producto</h1></div>
    <form class="card border-0 shadow-sm p-4" th:action="${editing == true} ? @{/admin/products/{id}/edit(id=${productId})} : @{/admin/products}" th:object="${productForm}" method="post">
        <div class="row g-3">
            <div class="col-12"><label class="form-label" for="productName">Nombre</label><input id="productName" class="form-control" th:field="*{name}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('name')}"><div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div></div>
            <div class="col-12"><label class="form-label" for="productDescription">Descripción</label><textarea id="productDescription" class="form-control" rows="4" th:field="*{description}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('description')}"></textarea><div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</div></div>
            <div class="col-md-6"><label class="form-label" for="productImagePath">Ruta de imagen</label><input id="productImagePath" class="form-control" th:field="*{imagePath}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('imagePath')}"><div class="form-text">Ejemplo: /assets/product-flower.svg</div><div class="invalid-feedback" th:if="${#fields.hasErrors('imagePath')}" th:errors="*{imagePath}">Error</div></div>
            <div class="col-md-6"><label class="form-label" for="productCategory">Categoría</label><select id="productCategory" class="form-select" th:field="*{categoryId}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('categoryId')}"><option value="">Selecciona una categoría</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Categoría</option></select><div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">Error</div></div>
            <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit" th:text="${editing == true} ? 'Guardar cambios' : 'Crear producto'">Guardar cambios</button><a class="btn btn-outline-secondary" th:href="@{/admin/products}">Cancelar</a></div>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/admin-layout :: adminFooter}"></footer>
<script th:replace="~{fragments/admin-layout :: adminScripts}"></script>
</body>
</html>
