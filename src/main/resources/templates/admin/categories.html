<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Categorías')}"></head>
<body class="admin-body">
<nav th:replace="~{fragments/admin-layout :: adminNavbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/admin-layout :: adminFlash}"></div>
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4"><div><span class="section-kicker">Catálogo</span><h1 class="fw-bold mb-0">Categorías</h1></div><a class="btn btn-primary" th:href="@{/admin/categories/new}"><i class="bi bi-plus-lg me-1"></i>Nueva categoría</a></div>
    <div class="row g-3">
        <div class="col-12 col-md-6 col-xl-4" th:each="category : ${categories}">
            <article class="card admin-category-card border-0 shadow-sm h-100"><div class="card-body"><span class="category-symbol" aria-hidden="true"><i class="bi bi-tag"></i></span><h2 class="h5" th:text="${category.name}">Categoría</h2><p class="text-secondary" th:text="${category.description}">Descripción</p><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/categories/{id}/edit(id=${category.id})}">Editar</a><form th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post" data-confirm="¿Eliminar esta categoría?"><button class="btn btn-sm btn-link text-danger" type="submit">Eliminar</button></form></div></div></article>
        </div>
        <div class="col-12" th:if="${categories.isEmpty()}"><div class="alert alert-light border">No hay categorías registradas.</div></div>
    </div>
</main>
<footer th:replace="~{fragments/admin-layout :: adminFooter}"></footer>
<script th:replace="~{fragments/admin-layout :: adminScripts}"></script>
</body>
</html>
