<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead(${editing} ? 'Editar categoría' : 'Nueva categoría')}"></head>
<body class="admin-body">
<nav th:replace="~{fragments/admin-layout :: adminNavbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/admin-layout :: adminFlash}"></div>
    <div class="mb-4"><a class="btn btn-link px-0" th:href="@{/admin/categories}"><i class="bi bi-arrow-left me-1"></i>Volver a categorías</a><h1 class="fw-bold" th:text="${editing} ? 'Editar categoría' : 'Nueva categoría'">Nueva categoría</h1></div>
    <form class="card border-0 shadow-sm p-4" th:action="${editing == true} ? @{/admin/categories/{id}/edit(id=${categoryId})} : @{/admin/categories}" th:object="${categoryForm}" method="post">
        <div class="row g-3"><div class="col-12"><label class="form-label" for="categoryName">Nombre</label><input id="categoryName" class="form-control" th:field="*{name}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('name')}"><div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div></div><div class="col-12"><label class="form-label" for="categoryDescription">Descripción</label><textarea id="categoryDescription" class="form-control" rows="3" th:field="*{description}" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('description')}"></textarea><div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</div></div><div class="d-flex gap-2"><button class="btn btn-primary" type="submit" th:text="${editing == true} ? 'Guardar cambios' : 'Crear categoría'">Guardar cambios</button><a class="btn btn-outline-secondary" th:href="@{/admin/categories}">Cancelar</a></div></div>
    </form>
</main>
<footer th:replace="~{fragments/admin-layout :: adminFooter}"></footer>
<script th:replace="~{fragments/admin-layout :: adminScripts}"></script>
</body>
</html>
