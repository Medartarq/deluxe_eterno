<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Consultas')}"></head>
<body class="admin-body">
<nav th:replace="~{fragments/admin-layout :: adminNavbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/admin-layout :: adminFlash}"></div>
    <div class="mb-4"><span class="section-kicker">Consultas</span><h1 class="fw-bold mb-0">Solicitudes recibidas</h1></div>
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Remitente</th><th>Contacto</th><th>Mensaje</th><th>Estado</th><th class="text-end">Actualizar</th></tr></thead>
                <tbody>
                <tr th:each="inquiry : ${inquiries}">
                    <td><strong th:text="${inquiry.name}">Nombre</strong><div class="small text-secondary" th:text="${inquiry.createdAt}">Fecha</div></td>
                    <td><div th:text="${inquiry.email}">Correo</div><div class="small text-secondary" th:text="${inquiry.phone ?: 'Sin teléfono'}">Teléfono</div></td>
                    <td class="inquiry-message" th:text="${inquiry.message}">Mensaje</td>
                    <td><span class="badge" th:classappend="${inquiry.status.name() == 'NEW'} ? ' text-bg-warning' : (${inquiry.status.name() == 'RESOLVED'} ? ' text-bg-success' : ' text-bg-secondary')" th:text="${inquiry.status}">NEW</span></td>
                    <td class="text-end"><form class="d-flex justify-content-end gap-2" th:action="@{/admin/inquiries/{id}/status(id=${inquiry.id})}" method="post"><select class="form-select form-select-sm w-auto" name="status" th:aria-label="${'Estado de la consulta de ' + inquiry.name}"><option value="NEW" th:selected="${inquiry.status.name() == 'NEW'}">Nueva</option><option value="READ" th:selected="${inquiry.status.name() == 'READ'}">Leída</option><option value="RESOLVED" th:selected="${inquiry.status.name() == 'RESOLVED'}">Resuelta</option></select><button class="btn btn-sm btn-primary" type="submit">Guardar</button></form></td>
                </tr>
                <tr th:if="${inquiries.isEmpty()}"><td colspan="5" class="text-center text-secondary py-4">No hay consultas registradas.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/admin-layout :: adminFooter}"></footer>
<script th:replace="~{fragments/admin-layout :: adminScripts}"></script>
</body>
</html>
