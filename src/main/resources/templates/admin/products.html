<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Productos')}"></head><body class="admin-body">
<nav th:replace="~{fragments/admin-layout :: adminNavbar}"></nav>
<main class="container py-4"><div th:replace="~{fragments/admin-layout :: adminFlash}"></div>
<div class="module-heading"><div><span class="section-kicker">Tu catálogo</span><h1>Productos</h1><p class="text-secondary mb-0">Cada detalle, listo para encontrar su ocasión.</p></div><a class="btn btn-primary" th:href="@{/admin/products/new}"><i class="bi bi-plus-lg me-2"></i>Nuevo producto</a></div>
<div class="module-stats my-4"><div><span>Productos</span><strong th:text="${total}"></strong></div><div><span>Publicados</span><strong th:text="${published}"></strong></div><div><span>Borradores</span><strong th:text="${drafts}"></strong></div><div><span>Stock bajo</span><strong th:text="${lowStock}"></strong></div></div>
<form class="module-filters mb-4" method="get" th:action="@{/admin/products}"><div class="filter-search"><label class="form-label" for="search">Buscar producto</label><input id="search" name="q" th:value="${q}" class="form-control" placeholder="Nombre o código" maxlength="120"></div><div><label class="form-label" for="categoryFilter">Categoría</label><select id="categoryFilter" class="form-select" name="categoryId"><option value="">Todas</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${selectedCategory == category.id}"></option></select></div><div><label class="form-label" for="statusFilter">Publicación</label><select id="statusFilter" class="form-select" name="status"><option value="">Todos</option><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${selectedStatus == status}"></option></select></div><div><label class="form-label" for="modeFilter">Modalidad</label><select id="modeFilter" class="form-select" name="mode"><option value="">Todas</option><option th:each="mode : ${supplyModes}" th:value="${mode}" th:text="${mode.label}" th:selected="${selectedMode == mode}"></option></select></div><button class="btn btn-outline-primary" type="submit">Filtrar</button><a class="btn btn-link" th:href="@{/admin/products}">Limpiar</a></form>
<div class="card border-0"><div class="table-responsive"><table class="table module-table align-middle mb-0"><thead><tr><th>Producto</th><th>Estado</th><th>Disponibilidad</th><th>Precio</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="product : ${products}"><td data-label="Producto"><div class="d-flex align-items-center gap-3"><img th:if="${!#strings.isEmpty(product.imagePath)}" th:src="@{${product.imagePath}}" class="admin-table-image" th:alt="${product.name}" loading="lazy"><span th:if="${#strings.isEmpty(product.imagePath)}" class="admin-table-image d-inline-grid align-items-center text-center"><i class="bi bi-image"></i></span><div><strong th:text="${product.name}"></strong><div class="small text-secondary"><span th:text="${product.sku}"></span> · <span th:text="${product.category.name}"></span></div></div></div></td>
<td data-label="Estado"><span class="status-pill" th:classappend="${product.active} ? ' status-published' : ''" th:text="${product.publicationStatus.label}"></span></td>
<td data-label="Disponibilidad"><span th:text="${product.availabilityLabel}"></span><small class="d-block text-secondary" th:if="${product.supplyMode.name() == 'STOCK'}" th:text="${product.availableQuantity + ' disponibles · ' + product.reservedQuantity + ' reservadas'}"></small></td><td data-label="Precio" th:text="${product.priceLabel}"></td>
<td data-label="Acciones"><div class="product-actions"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/{id}/edit(id=${product.id})}" th:aria-label="${'Editar ' + product.name}">Editar</a><details class="admin-row-options"><summary th:aria-label="${'Más opciones de ' + product.name}">Más <i class="bi bi-chevron-down" aria-hidden="true"></i></summary><div class="admin-row-menu"><a th:if="${product.active}" th:href="@{/productos/{id}(id=${product.id})}"><i class="bi bi-shop" aria-hidden="true"></i> Ver en tienda</a><a th:href="@{/admin/inventory/{id}(id=${product.id})}"><i class="bi bi-boxes" aria-hidden="true"></i> Ver stock</a><form th:action="@{/admin/products/{id}/duplicate(id=${product.id})}" method="post"><button type="submit" th:aria-label="${'Duplicar ' + product.name}"><i class="bi bi-copy" aria-hidden="true"></i> Duplicar</button></form><form th:if="${product.active}" th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" data-confirm="¿Archivar el producto? Conservará sus datos e historial."><button class="text-danger" type="submit"><i class="bi bi-archive" aria-hidden="true"></i> Archivar</button></form><form th:unless="${product.active}" th:action="@{/admin/products/{id}/activate(id=${product.id})}" method="post"><button type="submit"><i class="bi bi-eye" aria-hidden="true"></i> Publicar</button></form></div></details></div></td></tr>
<tr th:if="${products.isEmpty()}"><td colspan="5" class="text-center py-5"><i class="bi bi-search fs-2 d-block mb-3"></i>No hay productos que coincidan con estos filtros.</td></tr>
</tbody></table></div></div></main><footer th:replace="~{fragments/admin-layout :: adminFooter}"></footer><th:block th:replace="~{fragments/admin-layout :: adminScripts}"></th:block></body></html>
