<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Productos')}"></head>
<body class="admin-body">
<nav th:replace="~{fragments/admin-layout :: adminNavbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/admin-layout :: adminFlash}"></div>
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4"><div><span class="section-kicker">Catálogo</span><h1 class="fw-bold mb-0">Productos</h1></div><a class="btn btn-primary" th:href="@{/admin/products/new}"><i class="bi bi-plus-lg me-1"></i>Nuevo producto</a></div>
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Producto</th><th>Categoría</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td><div class="d-flex align-items-center gap-2"><img th:src="@{${product.imagePath}}" class="admin-table-image" th:alt="${product.name}" alt=""><div><strong th:text="${product.name}">Producto</strong><div class="small text-secondary" th:text="${product.description}">Descripción</div></div></div></td>
                    <td th:text="${product.category.name}">Categoría</td>
                    <td><span class="badge" th:classappend="${product.active} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${product.active} ? 'Activo' : 'Inactivo'">Activo</span></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/{id}/edit(id=${product.id})}">Editar</a><form th:if="${product.active}" class="d-inline" th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" data-confirm="¿Eliminar este producto del catálogo?"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form><form th:unless="${product.active}" class="d-inline" th:action="@{/admin/products/{id}/activate(id=${product.id})}" method="post"><button class="btn btn-sm btn-outline-primary" type="submit">Publicar</button></form></td>
                </tr>
                <tr th:if="${products.isEmpty()}"><td colspan="4" class="text-center text-secondary py-4">No hay productos registrados.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/admin-layout :: adminFooter}"></footer>
<script th:replace="~{fragments/admin-layout :: adminScripts}"></script>
</body>
</html>
